# 金融分析团队 - 依赖声明

skills:
  - name: stock-fundamental-analysis
    version: ">=1.0.0"
    source: builtin
    required: true

  - name: stock-valuation-analysis
    version: ">=1.0.0"
    source: builtin
    required: true

  - name: stock-technical-analysis
    version: ">=1.0.0"
    source: builtin
    required: true

  - name: financial-anomaly-detection
    version: ">=1.0.0"
    source: builtin
    required: true

  - name: portfolio-construction
    version: ">=1.0.0"
    source: builtin
    required: true

  - name: investment-report-generation
    version: ">=1.0.0"
    source: builtin
    required: true

tools:
  - name: executeCommand
    description: 执行Python分析脚本
    required: true

  - name: readFile
    description: 读取分析结果和配置文件
    required: true

  - name: writeFile
    description: 输出Portfolio.json和研报文件
    required: true

environment:
  python: ">=3.9"
  dependencies:
    - pymysql
    - python-dotenv
  database:
    type: mysql
    description: "market_data 数据库（stock_financial, stock_kline, company_info 等表）"
